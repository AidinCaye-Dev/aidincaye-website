# Rebuilds the site every day so new gigs from Aidin's calendar, the latest YouTube video and releases appear on their own.
# About 30 builds a month, in Aidin's own Cloudflare account (free plan: 500).
# One-time setup:
#   1. Cloudflare dashboard -> Workers & Pages -> aidincaye-website -> Settings -> Builds & deployments -> Deploy hooks -> create one.
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions -> New secret: CF_DEPLOY_HOOK = the hook URL.
name: Refresh site data
on:
  schedule:
    - cron: "41 3 * * *"   # 03:41 UTC daily (05:41 SAST)
  workflow_dispatch:
permissions: {}
jobs:
  trigger-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "CF_DEPLOY_HOOK not set"; exit 1; fi
          curl --fail --silent --show-error -X POST "$HOOK"
